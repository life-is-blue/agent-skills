# Generic worked skeleton — not a project's real .cnb.yml.
# Copy to a repo root as .cnb.yml, then replace <PLACEHOLDER> values and the
# stage scripts with the real commands identified during Inventory/Map.
# Verified against https://docs.cnb.cool/zh/build/grammar.html.

# --- 1. PR/push quality gate: fast, always runs, no write access needed. ---
.verify-check: &verify-check
  name: verify-check
  ifModify:
    - .cnb.yml
    - .cnb/web_trigger.yml
    - src/**
    - package.json
  docker:
    image: <BASE_IMAGE>              # e.g. oven/bun:1, node:20, python:3.12
  stages:
    - name: install-system-deps
      script: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates openssh-client rsync curl jq
          rm -rf /var/lib/apt/lists/*
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache git ca-certificates openssh-client rsync curl jq
        else
          echo "Unsupported package manager: need apt-get or apk" >&2
          exit 1
        fi
    - name: install
      script: <INSTALL_COMMAND>       # e.g. bun install --frozen-lockfile
    - name: check
      script: <CHECK_COMMAND>         # e.g. bun run check / npm test / pytest

# --- 2. Build/publish job: mutually exclusive, secrets via imports. ---
.build-publish: &build-publish
  name: build-publish
  lock:
    key: <REPO_NAME>-build-publish
    wait: true
    cancel-in-wait: true
    timeout: 1800                    # seconds to wait for the lock
    expires: 3600                    # seconds before a stuck lock auto-releases
  ifModify:
    - .cnb.yml
    - src/**
  docker:
    image: <BASE_IMAGE>
  # Secrets repo: keys become env vars, injected automatically. Never inline
  # secret values here. https://docs.cnb.cool/zh/repo/secret.html
  imports:
    - https://cnb.cool/<ORG>/<SECRET_REPO>/-/blob/main/<PROJECT>.env.yml
  env:
    # Bridge CNB built-ins to whatever your scripts currently read from
    # GITHUB_REF_NAME/GITHUB_SHA during the migration's transition period.
    GITHUB_REF_NAME: $CNB_BRANCH
    GITHUB_SHA: $CNB_BRANCH_SHA
    DRY_RUN: "${DRY_RUN:-1}"
  stages:
    - name: install
      script: <INSTALL_COMMAND>
    - name: build
      script: <BUILD_COMMAND>
    - name: run-long-task
      # A job's default timeout is 2h (and it is killed after 10 minutes with
      # no stdout/stderr output, even before that). If a step can legitimately
      # run longer, declare it explicitly (ceiling: 12h) rather than assume
      # the default is enough — a silent kill mid-run is worse than a
      # deliberate checkpoint-and-exit. https://docs.cnb.cool/zh/build/timeout.html
      timeout: 6h
      script: <LONG_RUNNING_COMMAND>
    - name: maybe-publish
      script: |
        if [ "${DRY_RUN}" = "1" ]; then
          echo "DRY_RUN=1: skip publish."
          exit 0
        fi
        <PUBLISH_COMMAND>

main:
  push:
    - <<: *verify-check
    - <<: *build-publish
  pull_request:
    - <<: *verify-check
  # Minimum interval is 5 minutes; shorter cron expressions are rejected.
  # https://docs.cnb.cool/zh/build/crontab.html
  "crontab: 0 16 * * 1":
    - <<: *build-publish
  # Event name referenced by .cnb/web_trigger.yml's `event:` field.
  web_trigger_build_publish:
    - <<: *build-publish

# Tag-triggered jobs live under the catch-all branch key ($), not `main`.
# --- 3. Release on tag: only add this if you're actually migrating the
# release/publish workflow (Classify usually defers this to a later phase).
# Two different things, don't conflate them:
#   - `type: git:release` is a .cnb.yml pipeline task. Its fields are `tag`,
#     `title`, `description`/`descriptionFromFile`, `preRelease`, `latest`,
#     `overlying` — there is no `target_commitish` here.
#   - If you instead call CNB's OpenAPI directly from a custom script (e.g.
#     porting a `gh release create` call), THAT request body needs its own
#     `target_commitish` field — a real production bug in this org came from
#     omitting it there, not from the git:release task above.
$:
  tag_push:
    - <<: *build-publish
    - name: release
      stages:
        - name: upload-attachments
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/**
        - name: create-release
          type: git:release
          options:
            title: <RELEASE_TITLE>
            descriptionFromFile: CHANGELOG.md
