# Adaptation skeleton, NOT a ready-to-run migration. Replace every placeholder,
# main/tag patterns, timeouts and commands from the source workflow. Keep only
# events it actually needs. Install/check/build commands must have no external
# writes, including lifecycle hooks. No production credentials are loaded here.
# Grammar: https://docs.cnb.cool/zh/build/grammar.html

.build-check: &build-check
  name: build-check
  docker:
    image: <BASE_IMAGE>
  stages:
    - &install
      name: install
      timeout: 10m
      script: <INSTALL_COMMAND>
    - &check
      name: check
      timeout: 10m
      script: <CHECK_COMMAND>
    - &build
      name: build
      timeout: 30m
      script: <BUILD_COMMAND>

main:
  push:
    - <<: *build-check
      # Add ifModify only when the source workflow has path filters; include
      # its actual source/config/lockfile paths. It is not a security guard.
  pull_request:
    - <<: *build-check
  # Optional handler: add the matching button from cnb-docs.md only if needed.
  web_trigger_verify:
    - <<: *build-check
  # Optional schedule, intentionally inactive until explicitly in scope.
  # CNB uses Asia/Shanghai. Convert the source timezone, including day rollover.
  # "crontab: 0 16 * * 1":
  #   - <<: *build-check

# Optional release chain. Match the SOURCE tag filters; "$" is only a fallback,
# not a requirement for all tag events. Use exact/glob tag keys where needed.
$:
  tag_push:
    - name: build-and-release
      docker:
        image: <BASE_IMAGE>
      env:
        # This tag entry has no editable button parameter. Keep writes disabled
        # until cutover is explicitly authorized; then change this value to "0".
        # If adapting to editable web inputs, do not duplicate DRY_RUN in env.
        DRY_RUN: "1"
      stages:
        - name: validate-write-mode
          timeout: 1m
          script: |
            case "${DRY_RUN:-1}" in
              0|1) ;;
              *) echo "DRY_RUN must be 0 or 1" >&2; exit 1 ;;
            esac
        # Same Pipeline: stages are sequential and share the workspace.
        - *install
        - *check
        - *build
        - name: verify-artifact
          timeout: 1m
          # This skeleton expects one nonempty regular file, not a directory or
          # glob. For multiple artifacts, expand and validate every intended file.
          script: test -f "<ARTIFACT_PATH>" && test -s "<ARTIFACT_PATH>"
        - name: publish-release
          # Missing/empty values stay read-only. A variable is NOT authorization:
          # trust the triggering code and restrict who can change/run this entry.
          if: '[ "${DRY_RUN:-1}" = "0" ]'
          # Do not add ifModify/ifNewBranch alongside this if: they combine as OR.
          lock:
            key: release-$CNB_REPO_SLUG
            wait: true
            timeout: 60
            # Lock covers only this serial 5m + 10m publication block.
            # Tune with the real job ceilings; expiry must outlast the block.
            expires: 1800
          jobs:
            - name: create-release
              timeout: 5m
              type: git:release
              options:
                # tag defaults to the triggering tag for tag_push.
                title: $CNB_BRANCH
                description: <RELEASE_DESCRIPTION>
                # Default false deletes/recreates an existing Release. Avoid
                # that destructive default; verify first-run and rerun behavior.
                overlying: true
            - name: upload-attachments
              timeout: 10m
              image: cnbcool/attachments:latest
              settings:
                # A tag Release MUST exist before uploading its attachments.
                # Here tag_push selects that Release; other events default to
                # commit attachments unless a tag is explicitly supplied.
                attachments:
                  - <ARTIFACT_PATH>

# External secrets, only IF a real source task needs them:
# put imports on the minimal trusted Pipeline/Stage/Job, with the secret store's
# allow_* rules reviewed. include imports CI config, not secret values.
# imports:
#   - https://cnb.cool/<ORG>/<SECRET_REPO>/-/blob/main/<PROJECT>.env.yml
# Built-in same-repo Release tasks use the runtime CNB_TOKEN; don't introduce
# a second secret store or expose its values just to use this skeleton.
